name: Test
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev python3-dev python3-setuptools samtools pigz
      - name: Build and test
        run: make test
      - name: Demonstrate CRAM restoration
        run: make demo
